name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify tag matches KAST_VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^KAST_VERSION="\(.*\)"$/\1/p' scripts/kast)"
          echo "tag=${tag} script=${ver}"
          if [ "${tag}" != "${ver}" ]; then
            echo "::error::tag ${tag} does not match KAST_VERSION ${ver} in scripts/kast"
            exit 1
          fi

      - name: Build release tarball
        run: |
          # .gitattributes export-ignore keeps CI/dev files out of the tarball.
          git archive --format=tar.gz -o kast.tar.gz HEAD
          sha256sum kast.tar.gz > kast.tar.gz.sha256
          echo "--- contents ---"
          tar -tzf kast.tar.gz

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent: if the release was already created by hand (e.g. with
          # release notes written ahead of the tag push), attach/replace the
          # build assets on it instead of failing on "tag already exists".
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              kast.tar.gz kast.tar.gz.sha256 --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              kast.tar.gz kast.tar.gz.sha256 \
              --title "kast ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
