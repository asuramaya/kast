name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # First, before anything below can create a build/dist artifact that
      # would otherwise trip the row-count check for the wrong reason
      # (REPO-STANDARD.md: order the structure gate before any build step,
      # not just exclude gitignored paths from the count). Subsumes the old
      # narrow "one version constant" grep — check-repo's version check
      # covers every binary and the extension, not just two files.
      - name: Repo structure gate (REPO-STANDARD.md)
        run: make check-repo

      - name: ShellCheck
        # -e rather than --rcfile: the flag only exists from shellcheck 0.11.0
        # and ubuntu-latest ships an older build. Rationale per code is in the
        # Makefile, which carries the same exclusion list.
        run: shellcheck -e SC2155,SC1090,SC1091 install.sh uninstall.sh src/bin/kast src/bin/kast-healthcheck packaging/release-signing/sync-signers.sh tests/smoke.sh tests/test_signing.sh

      - name: Python helpers (syntax)
        run: python3 -m py_compile src/bin/kast-airplay src/bin/kast-control-center src/bin/kast-update src/share/kast/lib/sutra_update.py

      - name: Sutra vendor drift guard
        run: make check-sutra

      - name: Shell extension (syntax)
        run: |
          node --check "src/extension/kast@asuramaya/extension.js"
          node --check "src/extension/kast@asuramaya/prefs.js"

      - name: Shell extension metadata (valid JSON)
        run: python3 -c "import json; json.load(open('src/extension/kast@asuramaya/metadata.json'))"

      - name: man page (syntax)
        # -t -k, not just -Tutf8 -ww: the bare form exits 0 while silently
        # skipping the table and UTF-8 preprocessor passes, so a malformed
        # table would render clean. Family-wide hardening (Alfred, msg 1628).
        run: groff -t -k -man -Tutf8 -ww src/data/man/man1/kast.1 > /dev/null

      - name: CLI smoke
        run: bash tests/smoke.sh

      - name: Release-signing verify path
        run: bash tests/test_signing.sh
