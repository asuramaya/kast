name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # The family's shared CI core (sutra.mk's sibling layer -- see
  # docs/BOOTSTRAP.md in the sutra repo). Pinned to a commit SHA, not @main
  # and not a tag, per pill-ci.yml's own header: sutra cuts no tagged
  # release yet, and a floating @main ref would move every adopting pill's
  # CI the instant this file changes, with no per-pill review step.
  shared:
    uses: asuramaya/sutra/.github/workflows/pill-ci.yml@149b553b75467813748165401706ce6b50ca44d6
    with:
      python-files: "src/bin/kast-airplay src/bin/kast-control-center src/bin/kast-update src/share/kast/lib/sutra_update.py"
      shell-files: "install.sh uninstall.sh src/bin/kast src/bin/kast-healthcheck packaging/release-signing/sync-signers.sh tests/smoke.sh tests/test_signing.sh"
      shellcheck-files: "install.sh uninstall.sh src/bin/kast src/bin/kast-healthcheck packaging/release-signing/sync-signers.sh tests/smoke.sh tests/test_signing.sh"
      shellcheck-exclude: "SC2155,SC1090,SC1091"
      has-extension: true
      extension-js: "src/extension/kast@asuramaya/extension.js"
      extension-metadata: "src/extension/kast@asuramaya/metadata.json"
      man-pages: "src/data/man/man1/kast.1"
      # run-attack, run-check-version, run-signing-verify all stay at their
      # defaults (false): kast has no daemon/socket surface to fuzz (`make
      # attack` is a documented no-op exemption, see the Makefile);
      # packaging/VERSION is the one version constant, read live at
      # runtime -- there is no per-file literal to check, and check-repo's
      # own rule enforces exactly the opposite of what check-version tests
      # for (same convention as ByeByte/RAMstein); and test_signing.sh is
      # already covered by run-smoke -- `make smoke`'s own recipe runs it,
      # so run-signing-verify would run it a second time.

  # Genuinely kast-specific, per pill-ci.yml's own header ("stays as a
  # sibling job in the calling pill's own ci.yml").
  kast-specific:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The checkout-run resolution guard. No pill-ci.yml step exists for
      # this (confirmed by reading its full step list) -- sutra.mk's
      # check-vendored-path validates one binary per call. kast has exactly
      # one sutra-importing binary (kast-update, binding sutra_update, not
      # sutra -- see the Makefile's SUTRA_CHECK_MODULE/SUTRA_CHECK_BIN),
      # so this calls check-vendored-path directly rather than the
      # SUTRA_CHECK_BINS + check-vendored-path-all loop RAMstein/ByeByte
      # need for their several sutra-importing binaries.
      - name: Vendored-path resolution (kast-update -> sutra_update)
        run: make check-vendored-path

      # kast is the only pill (so far) with a second GNOME extension entry
      # point: pill-ci.yml's has-extension step above checks exactly one JS
      # file (extension-js), so prefs.js -- the settings dialog -- needs
      # its own step here or it silently loses syntax checking on adoption.
      - name: prefs.js (syntax)
        run: node --check "src/extension/kast@asuramaya/prefs.js"
