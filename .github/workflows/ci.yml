name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh scripts/kast tests/smoke.sh

      - name: Python helpers (syntax)
        run: python3 -m py_compile scripts/kast-airplay scripts/kast-control-center

      - name: Shell extension (syntax)
        run: |
          node --check "shell-extension/kast@asuramaya/extension.js"
          node --check "shell-extension/kast@asuramaya/prefs.js"

      - name: Shell extension metadata (valid JSON)
        run: python3 -c "import json; json.load(open('shell-extension/kast@asuramaya/metadata.json'))"

      - name: CLI smoke
        run: bash tests/smoke.sh
