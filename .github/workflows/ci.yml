name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: VERSION matches KAST_VERSION
        run: |
          file="$(tr -d '[:space:]' < VERSION)"
          script="$(sed -n 's/^KAST_VERSION="\(.*\)"$/\1/p' bin/kast)"
          echo "VERSION=${file} script=${script}"
          if [ "${file}" != "${script}" ]; then
            echo "::error::VERSION ${file} does not match KAST_VERSION ${script} in bin/kast"
            exit 1
          fi

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh bin/kast bin/kast-healthcheck tools/sync-signers.sh tests/smoke.sh tests/test_signing.sh

      - name: Python helpers (syntax)
        run: python3 -m py_compile bin/kast-airplay bin/kast-control-center bin/kast-update bin/sutra_update.py

      - name: Sutra vendor drift guard
        run: make check-sutra

      - name: Shell extension (syntax)
        run: |
          node --check "shell-extension/kast@asuramaya/extension.js"
          node --check "shell-extension/kast@asuramaya/prefs.js"

      - name: Shell extension metadata (valid JSON)
        run: python3 -c "import json; json.load(open('shell-extension/kast@asuramaya/metadata.json'))"

      - name: CLI smoke
        run: bash tests/smoke.sh

      - name: Release-signing verify path
        run: bash tests/test_signing.sh
